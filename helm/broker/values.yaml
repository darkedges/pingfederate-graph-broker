replicaCount: 1 # Encrypted file store and portal sessions are single-instance.
image:
  broker: ghcr.io/your-org/directory-broker:0.1.0
  portal: ghcr.io/your-org/directory-portal:0.1.0
  pullPolicy: IfNotPresent
imagePullSecrets: []

existingSecret: directory-broker-credentials
portalTLSSecret: directory-portal-tls
# Optional secret containing the public PEM roots for private PingFederate CAs.
# Key: ca.crt. Go reads SSL_CERT_DIR in addition to bundled public roots.
pfCASecret: ""

broker:
  audience: https://directory-broker.example.com
  pfIssuer: https://pf.example.com
  pfIntrospectionURL: https://pf.example.com/as/introspect.oauth2
  pfPickupURL: https://pf.example.com/ext/ref/pickup
  pfAdapterID: graphDirectoryLink
  portalClientIDs: directory-portal
  agentClientIDs: directory-agent
  introspectionClientID: directory-broker-rs
  entraTenantID: 00000000-0000-0000-0000-000000000000
  entraClientID: 00000000-0000-0000-0000-000000000000
  logLevel: info
  service:
    enabled: false # Enable only behind a reviewed mTLS mesh or TLS reverse proxy.

portal:
  publicURL: https://portal.example.com
  pfURL: https://pf.example.com
  pfBrowserURL: "" # Defaults to pfURL; override for separate browser/backchannel origins.
  referenceSubject: "" # Required when connectStartURL is set.
  samlSubject: ""
  samlConnectEnabled: false
  pfClientID: directory-portal
  agentClientID: directory-agent
  connectStartURL: ""
  logLevel: info
  serviceType: ClusterIP # LoadBalancer is useful when the app terminates TLS itself.

# Controller-specific annotations are deliberately supplied by the operator.
# Portal upstream is HTTPS on 443; broker upstream is HTTP on 8080.
# Configure HTTPS redirects on the controller. Never enable ingress access logs
# for OAuth callback query strings or Authorization headers.
ingress:
  portal:
    enabled: false
    className: ""
    host: ""
    tlsSecretName: ""
    annotations: {}
  broker:
    enabled: false
    className: ""
    host: ""
    tlsSecretName: ""
    allowHTTPUpstream: false
    annotations: {}

persistence:
  storageClassName: ""
  size: 1Gi

inbound:
  enabled: false
  entraClientID: ""
  pfClientID: directory-entra-exchange
  pfSubject: ""
  entraObjectID: ""

saml:
  enabled: false
  pfTokenURL: ""
  pfClientID: directory-saml-exchange
  entraTenantID: ""
  entraClientID: ""
  entraScope: ""
  oboClientID: ""
  expectedPFSubject: ""
  expectedEntraOID: ""
# When enabled, existingSecret also requires SAML_PF_CLIENT_SECRET,
# SAML_ENTRA_CLIENT_SECRET and SAML_OBO_CLIENT_SECRET.
# When enabled, existingSecret also requires INBOUND_ENTRA_CLIENT_SECRET
# and INBOUND_PF_CLIENT_SECRET. No secrets are passed to the portal.

resources:
  broker: {}
  portal: {}

# existingSecret must contain TOKEN_ENCRYPTION_KEY,
# PF_INTROSPECTION_CLIENT_SECRET, PF_PICKUP_USER, PF_PICKUP_PASSWORD,
# ENTRA_CLIENT_SECRET, PORTAL_PF_CLIENT_SECRET,
# PORTAL_AGENT_CLIENT_SECRET. Keep this secret and the encrypted PVC backed up
# separately. Do not put secret values in this chart or values files.
