{{- range $component := list "portal" "broker" }}
{{- $route := index $.Values.ingress $component }}
{{- if $route.enabled }}
{{- if and (eq $component "broker") (not $.Values.broker.service.enabled) }}
{{- fail "broker ingress requires broker.service.enabled=true" }}
{{- end }}
{{- if and (eq $component "broker") (not $route.allowHTTPUpstream) }}
{{- fail "broker ingress requires explicit allowHTTPUpstream=true after reviewing controller-to-pod network isolation or mesh encryption" }}
{{- end }}
{{- $host := required (printf "ingress.%s.host is required" $component) $route.host }}
{{- if and (eq $component "portal") (ne (trimSuffix "/" $.Values.portal.publicURL) (printf "https://%s" $host)) }}
{{- fail "portal.publicURL must equal the HTTPS portal ingress origin" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "directory-broker.name" $ }}-{{ $component }}
  labels:
    {{- include "directory-broker.labels" $ | nindent 4 }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required (printf "ingress.%s.className is required" $component) $route.className | quote }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ required (printf "ingress.%s.tlsSecretName is required" $component) $route.tlsSecretName | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "directory-broker.name" $ }}-{{ ternary "portal" "api" (eq $component "portal") }}
                port:
                  number: {{ ternary 443 8080 (eq $component "portal") }}
{{- end }}
{{- end }}
