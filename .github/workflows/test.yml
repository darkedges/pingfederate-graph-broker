name: Test broker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build -buildvcs=false ./cmd/broker
